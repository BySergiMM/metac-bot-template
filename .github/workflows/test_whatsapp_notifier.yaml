name: Test WhatsApp notifier (temporary, one-off)

# TEMPORARY: exists only to fire a single manual test of scripts/notify.py's
# CallMeBot mechanism now that CALLMEBOT_APIKEY/CALLMEBOT_PHONE_NUMBER are
# configured as repo secrets. Manual dispatch only -- never runs on a
# schedule or push. Does not touch main.py, does not run the bot, does not
# call Metaculus, does not write notifications/state.json. Safe to delete
# once the test has been confirmed.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test_whatsapp:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify required secrets are present (never prints their values)
        run: |
          if [ -z "$CALLMEBOT_APIKEY" ]; then
            echo "::error::CALLMEBOT_APIKEY is not set"
            exit 1
          fi
          if [ -z "$CALLMEBOT_PHONE_NUMBER" ]; then
            echo "::error::CALLMEBOT_PHONE_NUMBER is not set"
            exit 1
          fi
          echo "Both secrets are present (values not shown)."
        env:
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          CALLMEBOT_PHONE_NUMBER: ${{ secrets.CALLMEBOT_PHONE_NUMBER }}
      # Reuses scripts/notify.py exactly as implemented -- no re-implementation
      # of the CallMeBot HTTP call here. One real call, one message.
      - name: Send one-off WhatsApp test message
        run: |
          python scripts/notify.py whatsapp --message "🤖 METACULUS BOT — TEST OK"
        env:
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          CALLMEBOT_PHONE_NUMBER: ${{ secrets.CALLMEBOT_PHONE_NUMBER }}
