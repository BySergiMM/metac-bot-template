name: Forecast on Metaculus Cup

# MANUAL ONLY, and since 2026-10-01 no longer the only way the Cup gets
# forecast: run_bot_on_tournament.yaml runs `--mode metaculus_cup` as its own
# step after every poll window. This workflow is the "catch up now" button.
#
# History, kept because it is why this file has no schedule: the cron that
# used to live here (`0 0 */2 * *`) made this a SECOND scheduled publisher
# under the same METACULUS_TOKEN, in a different concurrency group, so the two
# could publish simultaneously. It never fired only because GitHub disables
# scheduled workflows in a fork until enabled by hand (`disabled_fork`).
# tests/test_production_invariants.py asserts exactly one scheduled workflow
# can publish to a scored tournament.
#
# What changed since: this workflow now runs the pin step, and main.py keeps
# skip_previously_forecasted_questions=True in Cup mode, so a manual run
# forecasts only Cup questions the bot has not forecast yet.
on:
  workflow_dispatch:

# Least privilege: this job calls external APIs and never writes to the
# repository, opens a PR or publishes a package. Without this it inherits
# the repository-wide default, which is broader than anything here needs.
permissions:
  contents: read

# The PRODUCTION workflow's group, not this workflow's own: production also
# forecasts the Cup now, and two processes skipping "previously forecasted"
# questions at the same moment would both see the same question as new.
# Must stay identical to run_bot_on_tournament.yaml's `name:`.
concurrency:
  group: Forecast on new AI tournament questions
  cancel-in-progress: false


# Daily job to run the simple forecast bot
jobs:
  forecast_job:
    runs-on: ubuntu-latest # determines the machine that will run the job - keep as is
    steps: # sets up the steps that will be run in order
      # setup repository with all necessary dependencies - keep as is
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true
      - name: Install dependencies
        run: poetry install --no-interaction --no-root
      # The Metaculus Cup is a SCORED tournament. Every role runs on the Anthropic
      # key, which pin_models reads at patch time (backtest/pin_models.py).
      - name: Pin LLM models
        run: python backtest/pin_models.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Run bot
        run: |
          poetry run python main.py --mode metaculus_cup
        # this reads the environment variables from the github repository.
        # Store under Settings --> Secrets and variables --> Actions
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }} # replace this with the name of the variable under which you stored your own Metaculus token
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
