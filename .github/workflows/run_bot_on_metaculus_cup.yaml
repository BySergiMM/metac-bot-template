name: Forecast on Metaculus Cup

# MANUAL ONLY. The cron that used to live here (`0 0 */2 * *`) made this a
# SECOND scheduled publisher to a scored tournament, running under the same
# METACULUS_TOKEN as the tournament workflow and in a different concurrency
# group, so the two could publish simultaneously.
#
# It has never actually fired -- GitHub disables scheduled workflows in a fork
# until they are enabled by hand, and `gh workflow list` reports this one as
# `disabled_fork` with zero runs ever. That is an accident of the fork, not a
# control: enabling it in the UI would have started an unattended publisher.
#
# Two further reasons it must not run unattended:
#   * It does not run `backtest/pin_models.py`, so it would use whatever models
#     forecasting-tools picks by default -- currently a researcher model
#     OpenRouter no longer serves, which 404s every question.
#   * It sets skip_previously_forecasted_questions = False (main.py), so every
#     run re-forecasts every open Cup question.
#
# Removing the schedule makes the repository state match the intended
# operational state instead of relying on a GitHub default.
# tests/test_production_invariants.py asserts exactly one scheduled workflow
# can publish to a scored tournament.
on:
  workflow_dispatch:

# Least privilege: this job calls external APIs and never writes to the
# repository, opens a PR or publishes a package. Without this it inherits
# the repository-wide default, which is broader than anything here needs.
permissions:
  contents: read

# Add concurrency group to prevent parallel runs
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false


# Daily job to run the simple forecast bot
jobs:
  forecast_job:
    runs-on: ubuntu-latest # determines the machine that will run the job - keep as is
    steps: # sets up the steps that will be run in order
      # setup repository with all necessary dependencies - keep as is
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true
      - name: Install dependencies
        run: poetry install --no-interaction --no-root
      # The Metaculus Cup is a SCORED tournament, so this workflow must not
      # publish through the default model path. Without this step
      # forecasting-tools assigns the researcher role to
      # `openai/gpt-4o-search-preview`, which OpenRouter no longer serves, and
      # every question dies with a 404 -- after the run has already been
      # dispatched against real questions under the real token.
      #
      # One Gemini credential only, matching the tournament workflow. See the
      # R11 note there.
      - name: Pin LLM models
        run: python backtest/pin_models.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      - name: Run bot
        run: |
          poetry run python main.py --mode metaculus_cup
        # this reads the environment variables from the github repository.
        # Store under Settings --> Secrets and variables --> Actions
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }} # replace this with the name of the variable under which you stored your own Metaculus token
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}