name: Research - Track Record (read-only)

# RESEARCH ONLY. This workflow never forecasts.
#
# It downloads this bot's own already-scored history from Metaculus, scores it
# offline, checks the reconstruction against Metaculus' published scores, and
# publishes an aggregates-only summary.
#
# Safety properties, and how each is enforced rather than merely intended:
#
#   only GET            research/metaculus_read_api.py raises on any other verb
#   only closed qs      fetch defaults to statuses=resolved,closed; --include-open
#                       is NOT passed (using it would be human-in-the-loop)
#   never main.py       this job deliberately does NOT run `poetry install`, so
#                       forecasting-tools is absent and main.py cannot even import
#   token never logged  it travels in an Authorization header, never in a URL or
#                       a param, and is scoped to the single step that needs it
#   data never leaves   the dataset is written to $RUNNER_TEMP, outside the
#                       workspace, so no artifact path glob can reach it
#   artifact is safe    export_safe_report.py builds the output from an explicit
#                       allowlist and aborts if a banned field or a
#                       credential-shaped string survives
#
# The repository is PUBLIC, which means workflow artifacts are world-readable.
# That is why the artifact contains aggregates only, and why any mean over
# fewer than three observations is suppressed.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "fetch = dataset+report; diagnose = probe API access; smoke-test = probe candidate LLM providers; gemini-buckets = are the GEMINI*_API_KEY credentials independent quotas?"
        required: false
        default: "fetch"
        type: choice
        options: ["fetch", "diagnose", "smoke-test", "gemini-buckets"]
      tournaments:
        description: "Tournaments forming the coverage denominator (space separated)"
        required: false
        default: "33022 minibench"

# Least privilege: this job reads the checkout and nothing else. It cannot
# write to the repository, open a PR, or publish a package.
permissions:
  contents: read

concurrency:
  group: research-track-record
  cancel-in-progress: false

jobs:
  track_record:
    name: Fetch and analyse own track record
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # No forecasting-tools installation anywhere in this job. The research
      # lab itself is standard library only, which is what makes the "cannot
      # run the forecaster" guarantee structural instead of a promise.
      - name: Confirm the forecaster cannot run here
        run: |
          if python -c "import forecasting_tools" 2>/dev/null; then
            echo "::error::forecasting-tools is importable; this job must not be able to forecast"
            exit 1
          fi
          echo "forecasting-tools absent, as required"

      # tests/test_publication.py, tests/test_discovery.py and
      # tests/test_pipeline_hostile_model.py (added in 279ea9d) exercise the
      # REAL forecasting_tools client via tests/_real_forecasting_tools.py,
      # so their whole module cannot even be imported here -- that's the
      # SAME guarantee the step above just checked, working as intended.
      # Four more individual test methods reach for the real client the same
      # way. None of that is a regression to paper over: ci.yaml runs the
      # complete, unfiltered suite (all ~565 tests) with forecasting_tools
      # genuinely installed, on every push and pull request to main, and
      # that -- not this job -- is the gate those tests protect.
      #
      # requests is an ordinary declared dependency (pyproject.toml), not
      # part of the forecasting SDK, and installing it grants no ability to
      # reach Metaculus beyond what MetaculusReadClient already does with
      # urllib -- so it's safe here and lets the three real network
      # kill-switch tests run for real instead of being skipped.
      #
      # The selection below is an explicit, named exclude list (not a broad
      # file-pattern skip) so the ~50 other forecasting_tools-independent
      # checks in test_production_invariants.py and test_adversarial_logging.py
      # keep running in this job too. A test moving in or out of this set
      # without the list being updated fails loudly, not silently.
      - name: Unit tests (offline subset; forecasting_tools stays uninstalled)
        run: |
          pip install --quiet "requests>=2.32.3,<3.0.0"
          python - <<'PYEOF'
          import sys
          import unittest

          # Whole modules that import the real forecasting_tools client at
          # module scope and therefore cannot be collected without it.
          BLOCKED_MODULES = {
              "tests.test_discovery",
              "tests.test_pipeline_hostile_model",
              "tests.test_publication",
          }
          # Individual methods in an otherwise dependency-free module that
          # reach for the real forecasting_tools client inside the test body.
          BLOCKED_TESTS = {
              "tests.test_adversarial_logging.StdoutAndStderrUnderHostileOutputTests."
              "test_the_publication_report_contains_no_hostile_output",
              "tests.test_production_invariants.DiscoveryInvariants."
              "test_the_page_ceiling_is_explicit",
              "tests.test_production_invariants.PublicationInvariants."
              "test_the_comment_gets_more_attempts_than_the_sdk_alone",
              "tests.test_production_invariants.PublicationInvariants."
              "test_the_orphan_marker_is_a_stable_token",
              "tests.test_production_invariants.TestHarnessSafetyInvariants."
              "test_there_is_exactly_one_metaculus_client_class",
          }

          def real_forecasting_tools_is_loaded():
              """True only for the genuine package, never the suite's stub.

              Several modules install a bare ModuleType placeholder into
              sys.modules["forecasting_tools"] so they can run without the
              package on disk (tests/_real_forecasting_tools.py). The
              placeholder has no __path__; the real package always does.
              """
              module = sys.modules.get("forecasting_tools")
              return module is not None and hasattr(module, "__path__")

          def flatten(suite):
              for item in suite:
                  if isinstance(item, unittest.TestSuite):
                      yield from flatten(item)
                  else:
                      yield item

          loader = unittest.TestLoader()
          discovered = loader.discover(start_dir="tests", top_level_dir=".")

          kept = unittest.TestSuite()
          skipped = []
          for test in flatten(discovered):
              test_id = test.id()
              # A module that fails to import becomes a
              # unittest.loader._FailedTest whose id() is prefixed with
              # "unittest.loader._FailedTest." (exact form varies by Python
              # version), so match on suffix/prefix, not equality.
              blocked_module = any(
                  test_id == m or test_id.endswith("." + m) or test_id.startswith(m + ".")
                  for m in BLOCKED_MODULES
              )
              if blocked_module or test_id in BLOCKED_TESTS:
                  skipped.append(test_id)
                  continue
              kept.addTest(test)

          print("skipping {0} test(s) that require the real forecasting_tools "
                "client (covered by ci.yaml with real dependencies "
                "installed instead):".format(len(skipped)))
          for test_id in sorted(skipped):
              print("  - " + test_id)
          unexpected = len(skipped) - (len(BLOCKED_MODULES) + len(BLOCKED_TESTS))
          if unexpected:
              print("::error::skipped {0} more test(s) than the {1} named "
                    "above expect; the exclude list is stale".format(
                        len(skipped), len(BLOCKED_MODULES) + len(BLOCKED_TESTS)))
              sys.exit(1)

          assert not real_forecasting_tools_is_loaded(), (
              "the REAL forecasting_tools package got imported while "
              "selecting tests; this job must never import it"
          )

          result = unittest.TextTestRunner(verbosity=2).run(kept)

          assert not real_forecasting_tools_is_loaded(), (
              "the REAL forecasting_tools package got imported while "
              "running tests; this job must never import it"
          )

          sys.exit(0 if result.wasSuccessful() else 1)
          PYEOF

      # One tiny completion per candidate provider, to find out which of the
      # newly added secrets actually work. Deliberately excluded: OpenRouter
      # (known good, and a test would burn one of the ~50 free calls/day the
      # audit showed is the scarce resource) and xAI/Grok (no free tier).
      # Installs litellm but NOT forecasting-tools, so the "the forecaster
      # cannot run here" guarantee above still holds.
      - name: Smoke test candidate LLM providers
        if: ${{ github.event.inputs.mode == 'smoke-test' }}
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          # Candidate provider under evaluation. Scoped to this smoke-test step
          # only: it is deliberately NOT passed to the fetch/analyse steps, and
          # NOT to any forecasting workflow, so an untested provider cannot
          # reach production. smoke_test_providers.py prints variable names,
          # HTTP statuses and provider replies -- never a credential.
          ALIBABA_API_KEY: ${{ secrets.ALIBABA_API_KEY }}
        run: |
          pip install --quiet "litellm==1.80.10"
          python research/smoke_test_providers.py --litellm

      # Determines whether the four Gemini credentials draw on separate quota
      # buckets. A single call per key would only prove validity: the quota is
      # scoped PerProjectPerModel (measured, run 32295883751), and one project
      # can mint many keys, so independence is only decidable by interference --
      # saturate one key, then ask another for a completion inside the same
      # 60-second window.
      #
      # Keys are identified by sha256(key)[:8] and never printed; Google's error
      # bodies are scanned for live key material and redacted before display.
      #
      # This CONSUMES the production GEMINI_API_KEY's per-minute quota for about
      # a minute, so do not dispatch it while a MiniBench window is open. It
      # changes no configuration: DEFAULT_LIMITS and the fallback chain are
      # untouched by this job.
      - name: Probe Gemini quota buckets
        if: ${{ github.event.inputs.mode == 'gemini-buckets' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI2_API_KEY: ${{ secrets.GEMINI2_API_KEY }}
          GEMINI3_API_KEY: ${{ secrets.GEMINI3_API_KEY }}
          GEMINI4_API_KEY: ${{ secrets.GEMINI4_API_KEY }}
        run: |
          # Round A: saturate key 3, probe key 4. Round B reverses the pair, so
          # 3<->4 is demonstrated in both directions rather than one. Run
          # 32380381980 left exactly this pair unresolved: key 3 survived 22
          # attempts, so the cap is raised to 60 here. A key that still refuses
          # nothing is reported as ">60 RPM", never as an assumed number.
          python research/probe_gemini_quota_buckets.py --interference \
            --max-attempts 60 --keys GEMINI3_API_KEY,GEMINI4_API_KEY
          echo "--- reverse direction ---"
          sleep 65   # let the 60s window drain so round B starts clean
          python research/probe_gemini_quota_buckets.py --interference \
            --max-attempts 60 --keys GEMINI4_API_KEY,GEMINI3_API_KEY

      # Prints HTTP statuses and JSON key names only, never question content.
      # Exists because guessing which parameter the gateway rejects would cost
      # one push and one workflow run per guess.
      - name: Diagnose API access
        if: ${{ github.event.inputs.mode == 'diagnose' }}
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
        run: python research/fetch_own_track_record.py --diagnose

      # $RUNNER_TEMP is outside $GITHUB_WORKSPACE, so the raw Metaculus data
      # cannot be picked up by an artifact glob or committed by accident.
      # The dispatch input goes through an env var rather than being
      # interpolated into the shell line: `${{ }}` inside `run:` is textual
      # substitution, so a crafted input would execute as script.
      - name: Fetch own track record (GET only, closed questions only)
        if: ${{ github.event.inputs.mode == 'fetch' || github.event.inputs.mode == '' }}
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          TOURNAMENTS: ${{ github.event.inputs.tournaments || '33022 minibench' }}
        run: |
          read -r -a tournaments <<< "$TOURNAMENTS"
          python research/fetch_own_track_record.py \
            --out "$RUNNER_TEMP/datasets" \
            --tournaments "${tournaments[@]}"

      # No METACULUS_TOKEN from here on: the remaining steps work on local files.
      - name: Analyse
        if: ${{ github.event.inputs.mode == 'fetch' || github.event.inputs.mode == '' }}
        run: |
          python research/analyze_track_record.py \
            --root "$RUNNER_TEMP/datasets" \
            --json "$RUNNER_TEMP/full_report.json"

      - name: Build the publishable summary
        if: ${{ github.event.inputs.mode == 'fetch' || github.event.inputs.mode == '' }}
        run: |
          python research/export_safe_report.py \
            --in "$RUNNER_TEMP/full_report.json" \
            --out-json milestone2_summary.json \
            --out-text milestone2_report.txt

      - name: Refuse to publish raw data
        if: ${{ github.event.inputs.mode == 'fetch' || github.event.inputs.mode == '' }}
        run: |
          set -e
          for f in milestone2_summary.json milestone2_report.txt; do
            # grep on a missing file also returns non-zero, so existence is
            # checked first -- otherwise "no file" would read as "no leak".
            if [ ! -s "$f" ]; then
              echo "::error::$f is missing or empty"
              exit 1
            fi
            if grep -qiE 'metaculus\.com/questions|resolution_criteria|probability_of_resolution' "$f"; then
              echo "::error::$f contains raw Metaculus content; not uploading"
              exit 1
            fi
          done
          # Nothing from the dataset directory may have leaked into the workspace.
          if git status --porcelain | grep -vE 'milestone2_(summary\.json|report\.txt)' | grep -q .; then
            echo "::error::unexpected files in the workspace after the run"
            git status --porcelain
            exit 1
          fi
          echo "publication checks passed"

      - name: Upload aggregates-only summary
        if: ${{ github.event.inputs.mode == 'fetch' || github.event.inputs.mode == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: milestone2-track-record-summary
          if-no-files-found: error
          retention-days: 30
          path: |
            milestone2_summary.json
            milestone2_report.txt
