name: Test Bot

on:
  workflow_dispatch:
    inputs:
      research_engine:
        # A/B for claude_research: same unscored practice questions, research
        # by Haiku 5.5 (production default since 2026-10-18) or Sonnet 5.5. Compare the
        # "claude_research engine=..." log lines and the research text.
        description: "Claude research engine (haiku = production default | sonnet)"
        required: false
        default: "haiku"
        type: choice
        options: ["sonnet", "haiku"]
      opus_reasoning:
        # The Opus forecaster's effort for this run only (2026-10-23). The
        # default is production's, "xhigh" since 2026-10-24; "high" is the
        # old one, to compare the "reasoning ..." lines of the spend
        # breakdown below. Effort names only: a token budget returns 400 on
        # Opus 5.5 (see backtest/pin_models.py).
        description: "Opus forecaster reasoning effort (xhigh = production | high)"
        required: false
        default: "xhigh"
        type: choice
        options: ["xhigh", "high"]

# Least privilege: this job calls external APIs and never writes to the
# repository, opens a PR or publishes a package. Without this it inherits
# the repository-wide default, which is broader than anything here needs.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  forecast_job:
    runs-on: ubuntu-latest
    # This run's API spend, recorded as production records it (spend.py) but
    # in a ledger of its own: nothing here restores or saves the production
    # ledger, so test runs do not count towards the month.
    env:
      SPEND_LEDGER_PATH: spend_ledger.jsonl
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true
      - name: Install dependencies
        run: poetry install --no-interaction --no-root
      # Activates the pinned llms block in main.py, then --check sends one tiny
      # completion to each model. A dead model id is what broke every earlier run,
      # and it is cheaper to find out here than four minutes into a bot run.
      # Must go through poetry: --check imports litellm, which lives in the venv.
      - name: Pin and verify LLM models
        run: poetry run python backtest/pin_models.py --check
        env:
          # The chain is decided at patch time from the key, so the smoke test
          # exercises what production runs.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Read at PATCH time, like the keys above: it is written into the
          # generated llms= block, so the Run bot step needs nothing.
          FORECASTER_REASONING_OPUS: ${{ inputs.opus_reasoning }}
      - name: Run bot
        run: |
          poetry run python main.py --mode test_questions
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_RESEARCH_ENGINE: ${{ inputs.research_engine }}
      # Breakdown of what this test run cost, in the log and the step summary.
      # No WhatsApp credentials reach this step, so it can never alert.
      - name: Spend of this run
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          python spend.py after-run
          python spend.py breakdown
          python spend.py weekly
