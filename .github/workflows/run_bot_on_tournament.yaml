name: Forecast on new AI tournament questions

on:
  workflow_dispatch:
  schedule:
    # Every 5 minutes, GitHub's documented minimum interval. Measured over
    # 89 runs (2026-08-17..19), GitHub delivered only 49.2% of the declared
    # 20-minute schedule -- an effective cadence of 40.6 min against
    # MiniBench forecast windows that are 1.5-3h wide (418/418 questions
    # measured, none longer). At */5 the expected detection delay drops
    # from ~20 min to ~5 min, which is the margin a 60-question burst
    # needs to finish inside a 90-minute window.
    # The concurrency group below still guarantees one run at a time, so
    # a higher rate cannot produce overlapping runners.
    - cron: "*/5 * * * *"

# Add concurrency group to prevent parallel runs
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false


# Daily job to run the simple forecast bot
jobs:
  forecast_job:
    runs-on: ubuntu-latest # determines the machine that will run the job - keep as is
    steps: # sets up the steps that will be run in order
      # setup repository with all necessary dependencies - keep as is
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true
      # Adding the below will make the workflow faster, but will mean you don't automatically get updates from forecasting-tools and other packages
      # - name: Load cached venv
      #   id: cached-poetry-dependencies
      #   uses: actions/cache@v4
      #   with:
      #     path: .venv
      #     key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}
      - name: Install dependencies
        run: poetry install --no-interaction --no-root
      # forecasting-tools assigns the researcher role to a model OpenRouter no
      # longer serves, which 404s every question. This activates the pinned llms
      # block in main.py so the run uses models that actually exist.
      # The fallback chain activates only for keys present HERE: pin_models.py
      # reads os.environ at patch time, so a secret that reaches the bot step
      # but not this one produces a chain that silently stays empty.
      - name: Pin LLM models
        run: python backtest/pin_models.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # One Gemini quota bucket per credential. These must be present HERE,
          # not only on the bot step: pin_models reads os.environ at PATCH time
          # to decide how many chains to generate, so a key that reaches only
          # the bot produces a block with fewer buckets than credentials and
          # the extra quota is silently never used.
          GEMINI2_API_KEY: ${{ secrets.GEMINI2_API_KEY }}
          GEMINI3_API_KEY: ${{ secrets.GEMINI3_API_KEY }}
          GEMINI4_API_KEY: ${{ secrets.GEMINI4_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      - name: Run bot
        run: |
          poetry run python main.py
        # this reads the environment variables from the github repository.
        # Store under Settings --> Secrets and variables --> Actions
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }} # replace this with the name of the variable under which you stored your own Metaculus token
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
          # Fallback providers. Both verified by research/smoke_test_providers.py
          # before being wired in; absent keys simply disable their leg.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # bucket_backend reads these by NAME at bot runtime, so the values are
          # needed here as well as on the pin step above. Proven independent
          # quota buckets (15 RPM each) by interference in runs 32380381980 and
          # 32381181256, and exercised end to end on bot-testing-area in run
          # 32385978761: 154 calls spread 41/36/41/36, zero 429s, zero
          # RateLimitTimeouts, 3.03x faster than the same run on one bucket.
          # An absent key simply means one bucket fewer.
          GEMINI2_API_KEY: ${{ secrets.GEMINI2_API_KEY }}
          GEMINI3_API_KEY: ${{ secrets.GEMINI3_API_KEY }}
          GEMINI4_API_KEY: ${{ secrets.GEMINI4_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
