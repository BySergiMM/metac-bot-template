name: MiniBench Backtest

on:
  workflow_dispatch:

# Least privilege: this job calls external APIs and never writes to the
# repository, opens a PR or publishes a package. Without this it inherits
# the repository-wide default, which is broader than anything here needs.
permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch resolved MiniBench questions
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
        run: python backtest/minibench_backtest.py fetch --out dataset.json
      # The dataset is deliberately NOT uploaded. dataset.json holds Metaculus'
      # question titles, URLs, resolutions and community predictions, and this
      # repository is public, so a workflow artifact is world-readable.
      # Metaculus' Terms of Use restrict redistributing its API data (see
      # .gitignore and research/export_safe_report.py), so the data stays on
      # the runner and is discarded with it. The evaluate step below prints
      # aggregates only.
      - name: Evaluate baseline strategies
        run: python backtest/minibench_backtest.py evaluate --dataset dataset.json
